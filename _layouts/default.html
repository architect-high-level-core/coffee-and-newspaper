<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--page:#faf8f7;--ink:#101010;--text:#2d2c29;--muted:#73716a;--line:#e7e2dd;--accent:#ff5033;--link:#70429a;--link-hover:#542873;--ph-a:#f1eeeb;--ph-b:#e7e2dd;--hover-bg:#f3f0ec;--thumb-bg:#ece8e3;--placeholder:#a2a19b;--line-hover:#cfc9c2;--shadow:rgba(16,16,16,.06);
--sans:"Plus Jakarta Sans",Arial,Helvetica,sans-serif;--mono:"IBM Plex Mono",Menlo,Consolas,monospace}
html[data-theme="dark"]{--page:#0b0b0b;--ink:#f4f2ef;--text:#e8e6e3;--muted:#a19e97;--line:#2b2927;--link:#c7a6f0;--link-hover:#e0ccfa;--ph-a:#1a1918;--ph-b:#232120;--hover-bg:#181716;--thumb-bg:#1f1e1c;--placeholder:#7d7a74;--line-hover:#4a4744;--shadow:rgba(0,0,0,.5);color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
.site-header{border-bottom:1px solid var(--line);background:var(--page)}
.site-header .inner{position:relative;max-width:76rem;margin:0 auto;padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:center}
.brand{font-family:var(--sans);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:.5rem}
.brand::before{content:"";width:.95rem;height:.95rem;background:var(--accent);display:inline-block}
main{max-width:52rem;margin:0 auto;padding:2.5rem 1.5rem 0}
body.wide main{max-width:76rem}
.site-footer{max-width:76rem;margin:5rem auto 0;padding:1.5rem;border-top:1px solid var(--line);font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);text-align:center}
/* post header */
.post-title{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:clamp(1.35rem,3vw,1.75rem);line-height:1.4;letter-spacing:-.01em;margin:.5rem 0 0;max-width:48rem;text-wrap:balance}
.byline{margin:1.25rem 0 0;font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink)}
figure.header{margin:2rem 0 0}
img.header{width:100%;height:auto;display:block;border-radius:2px}
figure.header figcaption{font-family:var(--mono);font-size:.68rem;letter-spacing:.02em;color:var(--muted);margin-top:.6rem;line-height:1.5;word-break:break-word}
figure.header figcaption a{color:var(--muted)}
/* article body (Forward Future "originals" body) */
.post-body{font-family:var(--sans);font-size:1.125rem;line-height:1.78;font-weight:400;color:var(--text);margin-top:2rem}
.post-body p,.post-body ul,.post-body ol{margin:1.25rem 0 0}
.post-body ul,.post-body ol{padding-left:1.5rem}
.post-body li+li{margin-top:.5rem}
.post-body h1,.post-body h2,.post-body h3,.post-body h4,.post-body h5{font-family:var(--sans);font-weight:700;color:var(--ink)}
.post-body h2{border-top:1px solid var(--line);letter-spacing:-.025em;margin:3.5rem 0 0;padding-top:1.25rem;font-size:clamp(1.75rem,4vw,2.25rem);line-height:1.08}
.post-body h3{letter-spacing:-.015em;margin:2.5rem 0 0;font-size:clamp(1.35rem,3vw,1.65rem);line-height:1.18}
.post-body h4,.post-body h5{margin:1.5rem 0 0;font-size:1.125rem;line-height:1.25}
.post-body strong,.post-body b{font-weight:700;color:var(--ink)}
.post-body em,.post-body i{font-family:Georgia,"Times New Roman",Times,serif;font-style:italic;color:var(--ink)}
.post-body a{color:var(--link);text-decoration:underline;text-decoration-color:currentColor;text-decoration-thickness:.08em;text-underline-offset:.18em;word-break:break-word}
.post-body a:hover{color:var(--link-hover)}
.post-body blockquote{border-left:3px solid var(--accent);margin:1.5rem 0 0;padding-left:1rem;color:var(--muted)}
.post-body hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.post-body img{max-width:100%;height:auto;border-radius:0}
.post-body code{font-family:var(--mono);font-size:.9em}
.back{margin-top:3rem;font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em}
.back a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.back a:hover{color:var(--accent)}
/* homepage grid */
.grid{columns:1;column-gap:1.75rem}@media(min-width:600px){.grid{columns:2}}@media(min-width:900px){.grid{columns:3}}@media(min-width:1200px){.grid{columns:4}}
.tile{break-inside:avoid;display:block;margin:0 0 2.25rem;text-decoration:none}
.tile img,.tile .ph{width:100%;height:auto;display:block;border-radius:2px;transition:opacity .3s}.tile:hover img{opacity:.88}
.tile .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--ph-a),var(--ph-b))}
.tile .t{display:block;font-family:var(--mono);font-weight:700;color:var(--accent);font-size:.9rem;line-height:1.4;margin-top:.75rem}
.tile:hover .t{text-decoration:underline;text-underline-offset:.18em}
.tile .d{display:block;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:.4rem}
.search{position:absolute;left:1.5rem;top:50%;transform:translateY(-50%);width:13rem;z-index:30}
.search input{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--muted);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:.35rem 0;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--placeholder);opacity:1}
.search input:hover{border-bottom-color:var(--line-hover)}.search input:focus{border-bottom-color:var(--accent);color:var(--ink)}
.search input::-webkit-search-cancel-button{opacity:.4}
.sr{position:absolute;top:calc(100% + .6rem);left:0;width:min(27rem,calc(100vw - 3rem));max-height:70vh;overflow:auto;background:var(--page);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow);padding:.4rem 0}
.sr[hidden]{display:none}
.sr-item{display:flex;gap:.8rem;align-items:center;padding:.55rem .9rem;text-decoration:none}
.sr-item img,.sr-ph{flex:0 0 64px;width:64px;height:40px;object-fit:cover;border-radius:2px;background:var(--thumb-bg)}
.sr-txt{display:block;min-width:0}
.sr-t{display:block;font-family:var(--mono);font-weight:700;font-size:.78rem;line-height:1.35;color:var(--ink)}
.sr-d{display:block;font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:.2rem}
.sr-item:hover .sr-t,.sr-item:focus .sr-t{color:var(--accent)}
.sr-item:hover,.sr-item:focus{background:var(--hover-bg);outline:none}
.sr-none{margin:0;padding:.6rem .9rem;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
@media(max-width:900px){.site-header .inner{flex-wrap:wrap}.search{position:relative;left:auto;top:auto;transform:none;order:2;width:100%;margin-top:.7rem}.sr{width:100%}}
.brandwrap{display:flex;flex-direction:column;align-items:center}
.tagline{margin:.4rem 0 0;font-family:var(--mono);font-size:.64rem;line-height:1.3;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);text-align:center}
@media(max-width:600px){.tagline{font-size:.58rem;letter-spacing:.12em}}
.post-body{overflow-wrap:break-word}
.post-body table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
/* mobile overflow guard: long URLs/words wrap, media and code never widen the page */
.post-body a,.post-body li,.post-body p,figure.header figcaption,.post-title{overflow-wrap:anywhere}
.post-body img,.post-body video,.post-body iframe,.post-body svg,.post-body embed,.post-body object{max-width:100%;height:auto}
.post-body pre{max-width:100%;overflow-x:auto;white-space:pre}
.post-body code{overflow-wrap:anywhere}
/* light/dark toggle */
.theme-toggle{position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);display:flex;border:1px solid #101010;border-radius:2px;overflow:hidden;z-index:31}
html[data-theme="dark"] .theme-toggle{border-color:#f4f2ef}
.theme-toggle button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:30px;cursor:pointer;background:#101010;color:#f4f2ef;transition:background .2s,color .2s}
.theme-toggle button svg{width:15px;height:15px;display:block}
.theme-toggle button[aria-pressed="true"]{background:#fff;color:#101010}
.theme-toggle button:not([aria-pressed="true"]):hover{background:#2a2a2a}
.theme-toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media(max-width:900px){.brandwrap{flex:0 0 100%}.site-header .search{flex:1 1 auto;width:auto;min-width:0}.theme-toggle{position:static;transform:none;order:3;flex:0 0 auto;margin:.7rem 0 0 .9rem;align-self:flex-end}.theme-toggle button{width:30px;height:28px}}
.post-body th{color:var(--ink)}
.post-body th,.post-body td{border-color:var(--line)}
/* avatar left of search */
.avatar{position:absolute;left:1.5rem;top:50%;transform:translateY(-50%);display:block;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;line-height:0;z-index:31}
.avatar img{width:100%;height:100%;display:block;object-fit:cover}
.avatar:hover{box-shadow:0 0 0 1px var(--accent)}
.avatar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(min-width:901px){.site-header .search{left:calc(1.5rem + 40px + .8rem)}}
@media(max-width:900px){.avatar{position:static;transform:none;order:2;flex:0 0 32px;width:32px;height:32px;margin:.7rem .7rem 0 0;align-self:flex-end}}
/* floating avatar: appears once the header avatar scrolls away */
.avatar-float{position:fixed;left:max(.5rem,calc(50vw - 38rem - 60px));top:1rem;z-index:50;width:44px;height:44px;border-radius:50%;background:#fff;overflow:hidden;line-height:0;box-shadow:0 2px 10px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);opacity:0;transform:translateY(-6px) scale(.9);pointer-events:none;transition:opacity .25s,transform .25s}
html[data-theme="dark"] .avatar-float{box-shadow:0 2px 12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.14)}
.avatar-float.show{opacity:1;transform:none;pointer-events:auto}
.avatar-float img{width:100%;height:100%;display:block}
.avatar-float:hover{box-shadow:0 2px 10px rgba(0,0,0,.18),0 0 0 2px var(--accent)}
.avatar-float:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:900px){.avatar-float{left:1rem;top:auto;bottom:calc(1rem + env(safe-area-inset-bottom));transform:translateY(6px) scale(.9)}}
@media(prefers-reduced-motion:reduce){.avatar-float{transition:none}}
</style></head><body{% if page.wide %} class="wide"{% endif %}>
<header class="site-header"><div class="inner"><a class="avatar" href="{{ '/' | relative_url }}"><img src="{{ '/assets/img/avatar.png' | relative_url }}" srcset="{{ '/assets/img/avatar.png' | relative_url }} 1x, {{ '/assets/img/avatar@2x.png' | relative_url }} 2x" width="40" height="40" alt="Coffee &amp; Newspaper"></a>{% include search.html %}<div class="brandwrap"><a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a><p class="tagline">{{ site.description }}</p></div><div class="theme-toggle" role="group" aria-label="Colour theme"><button type="button" data-set-theme="light" aria-label="Light mode" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button><button type="button" data-set-theme="dark" aria-label="Dark mode" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div></div></header>
<a class="avatar-float" href="{{ '/' | relative_url }}" aria-label="Coffee &amp; Newspaper – back to top" tabindex="-1"><img src="{{ '/assets/img/avatar.png' | relative_url }}" srcset="{{ '/assets/img/avatar.png' | relative_url }} 1x, {{ '/assets/img/avatar@2x.png' | relative_url }} 2x" width="44" height="44" alt=""></a>
<main>{{ content }}</main>
<footer class="site-footer">{{ site.description }}</footer>
<script>(function(){var r=document.documentElement,b=document.querySelectorAll("[data-set-theme]");function sync(){var t=r.getAttribute("data-theme");for(var i=0;i<b.length;i++){b[i].setAttribute("aria-pressed",b[i].getAttribute("data-set-theme")===t?"true":"false")}}sync();for(var i=0;i<b.length;i++){b[i].addEventListener("click",function(){var t=this.getAttribute("data-set-theme");r.setAttribute("data-theme",t);try{localStorage.setItem("theme",t)}catch(e){}sync()})}})();</script>
<script>(function(){var home="{{ '/' | relative_url }}",f=document.querySelector(".avatar-float"),h=document.querySelector(".site-header .avatar");
function isHome(){var p=location.pathname;return p===home||p===home+"index.html"}
function top(e){if(isHome()){e.preventDefault();var r=window.matchMedia("(prefers-reduced-motion: reduce)").matches;window.scrollTo({top:0,behavior:r?"auto":"smooth"})}}
if(h)h.addEventListener("click",top);if(f)f.addEventListener("click",top);
if(f&&h&&"IntersectionObserver" in window){new IntersectionObserver(function(en){var on=!en[0].isIntersecting;f.classList.toggle("show",on);f.tabIndex=on?0:-1},{threshold:0}).observe(h)}})();</script>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body></html>
