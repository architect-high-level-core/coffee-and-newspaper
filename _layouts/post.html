---
layout: default
---
<article>
{% if page.image %}<img class="header" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">{% endif %}
<h1>{{ page.title }}</h1>
<p class="meta">{{ page.date | date: "%d.%m.%Y" }}</p>
{{ content }}
<p><a href="{{ '/' | relative_url }}">← Zurück zur Übersicht</a></p>
</article>
