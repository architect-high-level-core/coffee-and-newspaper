---
layout: default
---
<article>
<h1 class="post-title">{{ page.title }}</h1>
{% if page.listen %}<div class="listen" id="listen" role="group" aria-label="Read this article aloud" hidden><button type="button" class="listen-btn" data-listen-toggle data-state="idle" aria-label="Listen to this article"><svg class="i-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z" fill="currentColor"/></svg><span class="listen-label">Listen</span></button><button type="button" class="listen-btn listen-stop" data-listen-stop aria-label="Stop reading" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" fill="currentColor"/></svg><span>Stop</span></button></div>{% endif %}
<p class="byline">{{ page.date | date: "%-d %b %Y" }}</p>
{% if page.image %}<figure class="header"><img class="header" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">{% if page.image_credit %}<figcaption>{% if page.image_source_url %}<a href="{{ page.image_source_url }}" rel="nofollow noopener" target="_blank">{{ page.image_credit }}</a>{% else %}{{ page.image_credit }}{% endif %}{% if page.image_license %} · License: {% if page.image_license_url %}<a href="{{ page.image_license_url }}" rel="license">{{ page.image_license }}</a>{% else %}{{ page.image_license }}{% endif %}{% endif %}</figcaption>{% endif %}</figure>{% endif %}
<div class="post-body">
{{ content }}
</div>
<p class="back"><a href="{{ '/' | relative_url }}">← Back to all posts</a></p>
</article>
{% if page.listen %}<script src="{{ '/assets/js/listen.js' | relative_url }}" defer></script>{% endif %}
