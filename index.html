---
layout: default
wide: true
---
<div class="grid">
{% for post in site.posts %}<a class="tile" href="{{ post.url | relative_url }}">{% if post.image %}<img src="{{ post.image | relative_url }}" alt="{{ post.image_alt | default: post.title }}" loading="lazy">{% else %}<div class="ph"></div>{% endif %}<span class="t">{{ post.title }}</span><span class="d">{{ post.date | date: "%-d %b %Y" }}</span></a>
{% endfor %}</div>
