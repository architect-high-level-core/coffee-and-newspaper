---
layout: default
wide: true
---
<div class="grid">
{% for post in site.posts %}<a class="tile" href="{{ post.url | relative_url }}">{% if post.image %}<img src="{{ post.image | relative_url }}" alt="{{ post.image_alt | default: post.title }}" loading="lazy">{% else %}<div class="ph"></div>{% endif %}<div class="cap">{{ post.title }} · {{ post.date | date: "%d.%m.%Y" }}</div></a>
{% endfor %}</div>
