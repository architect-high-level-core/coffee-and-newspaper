---
layout: default
wide: true
---
<div class="grid">
{% for post in site.posts %}<div class="card"><a class="tile" href="{{ post.url | relative_url }}">{% if post.image %}<img src="{{ post.image | relative_url }}" alt="{{ post.image_alt | default: post.title }}" loading="lazy">{% else %}<div class="ph"></div>{% endif %}<span class="t">{{ post.title }}</span><span class="d">{{ post.date | date: "%-d %b %Y" }}</span></a>{% if post.audio %}<button type="button" class="ap-mini" data-ap-mini data-src="{{ post.audio | relative_url }}" data-dur="{{ post.audio_duration }}" data-title="{{ post.title | escape }}" data-state="idle" aria-pressed="false" aria-label="Listen to {{ post.title | escape }}"><svg class="i-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z" fill="currentColor"/></svg><span class="ap-mini-txt">Listen</span><span class="ap-mini-time">{{ post.audio_duration }}</span></button>{% endif %}</div>
{% endfor %}</div>
<script src="{{ '/assets/js/audio-player.js' | relative_url }}" defer></script>
